<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable variant: Android crops this to a circle/squircle/rounded square,
       so the mark is scaled to ~60% and centred inside the 80% safe zone.
       Full-bleed background, no rounded corners -- the mask supplies the shape. -->
  <rect width="512" height="512" fill="#0a0a0a"/>
  <g fill="#c8f736" transform="translate(256 256) scale(0.62) translate(-256 -256)">
    <rect x="112" y="236" width="288" height="40" rx="20"/>
    <rect x="132" y="176" width="44" height="160" rx="18"/>
    <rect x="336" y="176" width="44" height="160" rx="18"/>
    <rect x="84" y="212" width="34" height="88" rx="16"/>
    <rect x="394" y="212" width="34" height="88" rx="16"/>
  </g>
</svg>
