services:
  - type: web
    name: crohnjobs-web
    runtime: elixir
    buildCommand: ./build.sh
    preDeployCommand: echo "Skipping pre-deploy migrations (will run on first startup)"
    startCommand: _build/prod/rel/crohnjobs/bin/server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crohnjobs-db
          property: externalConnectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: ECTO_IPV6
        value: "false"
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: crohnjobs-db
    databaseName: crohnjobs
